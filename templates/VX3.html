<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VisionX</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#030712;
    --bg2:#0a0f1e;
    --bg3:#0f172a;
    --surface:rgba(15,23,42,0.85);
    --glass:rgba(14,165,233,0.06);
    --glass-border:rgba(14,165,233,0.18);
    --neon:#0ea5e9;
    --neon2:#06b6d4;
    --neon3:#8b5cf6;
    --neon-glow:0 0 8px rgba(14,165,233,0.5),0 0 24px rgba(14,165,233,0.2);
    --red:#ef4444;
    --green:#22c55e;
    --amber:#f59e0b;
    --text:#e2e8f0;
    --text-muted:#64748b;
    --text-dim:#334155;
    --font-display:'Orbitron',monospace;
    --font-mono:'Share Tech Mono',monospace;
    --font-body:'Inter',sans-serif;
    --r:8px;
    --r2:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
  }

  /* Animated grid background */
  body::before{
    content:'';
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(14,165,233,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(14,165,233,0.03) 1px,transparent 1px);
    background-size:40px 40px;
    animation:gridScroll 20s linear infinite;
    pointer-events:none;z-index:0;
  }
  @keyframes gridScroll{from{background-position:0 0}to{background-position:40px 40px}}

  /* Scanline overlay */
  body::after{
    content:'';
    position:fixed;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events:none;z-index:1;
  }

  #app{
    position:relative;z-index:2;
    display:flex;flex-direction:column;
    height:100vh;
  }

  /* ─── TOP BAR ─── */
  #topbar{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;
    height:56px;
    background:rgba(3,7,18,0.9);
    border-bottom:1px solid var(--glass-border);
    backdrop-filter:blur(12px);
  }
  .logo{
    display:flex;align-items:center;gap:10px;
  }
  .logo-icon{
    width:32px;height:32px;
    border:1.5px solid var(--neon);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--neon-glow);
    position:relative;overflow:hidden;
  }
  .logo-icon::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(14,165,233,0.2),transparent);
  }
  .logo-icon svg{width:18px;height:18px;color:var(--neon)}
  .logo-name{
    font-family:var(--font-display);
    font-size:18px;font-weight:900;
    letter-spacing:4px;
    color:var(--neon);
    text-shadow:var(--neon-glow);
  }
  .logo-name span{color:var(--neon3)}

  .topbar-right{display:flex;align-items:center;gap:12px}
  .status-pill{
    display:flex;align-items:center;gap:6px;
    padding:4px 10px;
    border:1px solid var(--glass-border);
    border-radius:20px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    background:var(--glass);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim)}
  .dot.green{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.red{background:var(--red);box-shadow:0 0 6px var(--red)}
  .dot.amber{background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .dot.pulse{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

  .hamburger{
    display:none;
    flex-direction:column;gap:4px;
    background:none;border:none;cursor:pointer;padding:6px;
  }
  .hamburger span{width:20px;height:1.5px;background:var(--neon);border-radius:2px;display:block;transition:all .3s}
  .hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4px,4px)}
  .hamburger.open span:nth-child(2){opacity:0}
  .hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px)}

  /* ─── MAIN LAYOUT ─── */
  #main{
    flex:1;min-height:0;
    display:grid;
    grid-template-columns:1fr 340px;
    gap:0;
  }

  /* ─── STREAM PANEL ─── */
  #stream-panel{
    position:relative;
    background:#000;
    overflow:hidden;
    border-right:1px solid var(--glass-border);
  }
  #stream-canvas{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
  }
  #stream-placeholder{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;
    color:var(--text-dim);
  }
  .cam-icon{
    width:64px;height:64px;
    border:2px solid var(--text-dim);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    opacity:0.4;
  }
  .cam-icon svg{width:32px;height:32px}
  #stream-placeholder p{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
    line-height:1.8;
  }
  #stream-img{
    width:100%;height:100%;
    object-fit:contain;
    display:none;
  }

  /* Stream overlay HUD */
  #stream-hud{
    position:absolute;top:12px;left:12px;right:12px;
    display:flex;justify-content:space-between;
    pointer-events:none;
    opacity:0;transition:opacity .3s;
  }
  #stream-hud.visible{opacity:1}
  .hud-badge{
    font-family:var(--font-mono);
    font-size:10px;
    padding:3px 8px;
    border-radius:4px;
    border:1px solid rgba(239,68,68,0.6);
    background:rgba(239,68,68,0.15);
    color:#fca5a5;
    display:flex;align-items:center;gap:5px;
  }
  .hud-badge.rec{
    border-color:rgba(239,68,68,0.8);
    animation:recBlink 1s ease-in-out infinite;
  }
  @keyframes recBlink{0%,100%{opacity:1}50%{opacity:0.5}}
  .hud-time{
    font-family:var(--font-mono);
    font-size:11px;
    color:rgba(255,255,255,0.5);
    align-self:center;
  }

  /* Corner brackets */
  .corner-tl,.corner-tr,.corner-bl,.corner-br{
    position:absolute;width:20px;height:20px;
    pointer-events:none;opacity:0.4;
  }
  .corner-tl{top:8px;left:8px;border-top:1.5px solid var(--neon);border-left:1.5px solid var(--neon)}
  .corner-tr{top:8px;right:8px;border-top:1.5px solid var(--neon);border-right:1.5px solid var(--neon)}
  .corner-bl{bottom:8px;left:8px;border-bottom:1.5px solid var(--neon);border-left:1.5px solid var(--neon)}
  .corner-br{bottom:8px;right:8px;border-bottom:1.5px solid var(--neon);border-right:1.5px solid var(--neon)}

  /* ─── RIGHT PANEL ─── */
  #right-panel{
    display:flex;flex-direction:column;
    background:var(--bg2);
    overflow:hidden;
  }
  #right-inner{
    flex:1;min-height:0;
    overflow-y:auto;
    padding:16px;
    display:flex;flex-direction:column;
    gap:14px;
  }
  #right-inner::-webkit-scrollbar{width:3px}
  #right-inner::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:2px}

  /* ─── SECTION LABELS ─── */
  .section-label{
    font-family:var(--font-display);
    font-size:9px;
    letter-spacing:3px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-bottom:8px;
  }

  /* ─── GLASS CARD ─── */
  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--r2);
    padding:14px;
  }

  /* ─── STREAM BUTTONS ─── */
  .btn-row{display:flex;flex-direction:column;gap:8px}
  .btn{
    width:100%;
    padding:11px 16px;
    border-radius:var(--r);
    border:1px solid var(--glass-border);
    background:rgba(14,165,233,0.08);
    color:var(--neon);
    font-family:var(--font-display);
    font-size:11px;
    letter-spacing:2px;
    cursor:pointer;
    transition:all .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    position:relative;overflow:hidden;
  }
  .btn::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(14,165,233,0.1),transparent);
    opacity:0;transition:opacity .2s;
  }
  .btn:hover::before{opacity:1}
  .btn:hover{border-color:var(--neon);box-shadow:var(--neon-glow)}
  .btn:active{transform:scale(0.98)}
  .btn:disabled{
    opacity:0.3;cursor:not-allowed;
    pointer-events:none;
  }
  .btn.active-stop{
    border-color:var(--red);
    background:rgba(239,68,68,0.1);
    color:#fca5a5;
    box-shadow:0 0 8px rgba(239,68,68,0.3);
  }
  .btn.rec-active{
    border-color:var(--red);
    background:rgba(239,68,68,0.12);
    color:#fca5a5;
    animation:recBorder 2s ease-in-out infinite;
  }
  @keyframes recBorder{0%,100%{box-shadow:0 0 6px rgba(239,68,68,0.4)}50%{box-shadow:0 0 16px rgba(239,68,68,0.7)}}

  /* ─── TOUCH STATUS ─── */
  .touch-display{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .touch-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
  }
  .touch-value{
    font-family:var(--font-mono);
    font-size:18px;
    font-weight:700;
    color:var(--text-dim);
    transition:color .3s,text-shadow .3s;
    letter-spacing:2px;
  }
  .touch-value.active{
    color:var(--green);
    text-shadow:0 0 10px var(--green);
  }
  .touch-bar{
    height:2px;
    background:var(--text-dim);
    border-radius:2px;
    margin-top:8px;
    overflow:hidden;
  }
  .touch-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,var(--neon),var(--neon3));
    transition:width .3s,background .3s;
    border-radius:2px;
  }
  .touch-fill.active{
    width:100%;
    background:linear-gradient(90deg,var(--green),#4ade80);
    box-shadow:0 0 8px var(--green);
  }

  /* ─── DESCRIPTION BOX ─── */
  #desc-section{flex:1;display:flex;flex-direction:column;min-height:0}
  .desc-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .tts-controls{display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:30px;height:30px;
    border-radius:6px;
    border:1px solid var(--glass-border);
    background:var(--glass);
    color:var(--text-muted);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
    flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--neon);color:var(--neon);box-shadow:var(--neon-glow)}
  .icon-btn.on{
    border-color:var(--neon3);
    color:var(--neon3);
    background:rgba(139,92,246,0.15);
    box-shadow:0 0 8px rgba(139,92,246,0.3);
  }
  .toggle-auto{
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:1px;
    padding:3px 8px;
    border-radius:20px;
    border:1px solid var(--glass-border);
    background:var(--glass);
    color:var(--text-muted);
    cursor:pointer;
    transition:all .2s;
  }
  .toggle-auto.on{
    border-color:var(--neon3);
    color:var(--neon3);
    background:rgba(139,92,246,0.15);
  }

  .desc-box{
    flex:1;min-height:120px;max-height:280px;
    background:rgba(0,0,0,0.3);
    border:1px solid var(--glass-border);
    border-radius:var(--r);
    padding:12px;
    overflow-y:auto;
    font-family:var(--font-mono);
    font-size:12px;
    line-height:1.7;
    color:var(--text-muted);
    position:relative;
  }
  .desc-box::-webkit-scrollbar{width:2px}
  .desc-box::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:2px}
  #desc-text{color:var(--text);word-break:break-word}
  #desc-text.empty{color:var(--text-dim);font-style:italic}
  .desc-cursor{
    display:inline-block;
    width:6px;height:12px;
    background:var(--neon);
    margin-left:2px;
    animation:blink .8s step-end infinite;
    vertical-align:middle;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ─── API STATUS ─── */
  #api-status{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-dim);
    padding:6px 10px;
    border-top:1px solid var(--glass-border);
    display:flex;align-items:center;gap:6px;
    flex-shrink:0;
    min-height:28px;
  }

  /* ─── MOBILE OVERRIDES ─── */
  @media(max-width:768px){
    html,body{overflow:auto;height:auto}
    #app{height:auto;overflow:visible}
    #main{
      grid-template-columns:1fr;
      grid-template-rows:auto auto;
    }
    #stream-panel{
      height:56vw;min-height:200px;
      border-right:none;
      border-bottom:1px solid var(--glass-border);
    }
    #right-panel{
      max-height:none;
      overflow:visible;
    }
    #right-inner{overflow:visible;max-height:none}
    .hamburger{display:flex}
    .topbar-status{display:none}
    .desc-box{max-height:180px}

    /* Mobile accordion */
    .accordion-header{
      cursor:pointer;
      display:flex;align-items:center;justify-content:space-between;
    }
    .accordion-header .chevron{
      transition:transform .3s;
      color:var(--text-muted);
    }
    .accordion-header.collapsed .chevron{transform:rotate(-90deg)}
    .accordion-body{
      overflow:hidden;
      max-height:500px;
      transition:max-height .3s ease;
    }
    .accordion-body.collapsed{max-height:0}
  }
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="9" r="3"/>
          <path d="M9 1v2M9 15v2M1 9h2M15 9h2"/>
          <path d="M3.5 3.5l1.5 1.5M13 13l1.5 1.5M3.5 14.5l1.5-1.5M13 5l1.5-1.5"/>
        </svg>
      </div>
      <span class="logo-name">VISION<span>X</span></span>
    </div>
    <div class="topbar-right">
      <div class="status-pill topbar-status">
        <span class="dot" id="wifi-dot"></span>
        <span id="wifi-label" style="font-size:10px">192.168.1.XXX</span>
      </div>
      <div class="status-pill topbar-status">
        <span class="dot" id="stream-dot"></span>
        <span id="stream-status-label" style="font-size:10px">IDLE</span>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <div id="main">

    <!-- STREAM PANEL -->
    <section id="stream-panel">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>

      <div id="stream-placeholder">
        <div class="cam-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M23 7l-7 5 7 5V7z"/>
            <rect x="1" y="5" width="15" height="14" rx="2"/>
          </svg>
        </div>
        <p>STREAM OFFLINE<br/><span style="font-size:10px;color:var(--text-dim)">Press START STREAMING to begin</span></p>
      </div>

      <img id="stream-img" alt="ESP32 Video Stream"/>

      <div id="stream-hud">
        <div class="hud-badge" id="hud-live" style="display:none">
          <span class="dot red pulse"></span> LIVE
        </div>
        <div class="hud-badge rec" id="hud-rec" style="display:none">
          <span class="dot red"></span> REC
        </div>
        <div class="hud-time" id="hud-time">--:--:--</div>
      </div>
    </section>

    <!-- RIGHT PANEL -->
    <aside id="right-panel">
      <div id="right-inner">

        <!-- STREAM CONTROL -->
        <div>
          <div class="section-label accordion-header" id="ctrl-header">
            <span>STREAM CONTROL</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4l4 4 4-4"/></svg>
          </div>
          <div class="accordion-body" id="ctrl-body">
            <div class="card">
              <div class="btn-row">
                <button class="btn" id="btn-stream">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="3,1 13,7 3,13"/></svg>
                  <span id="btn-stream-label">START STREAMING</span>
                </button>
                <button class="btn" id="btn-rec" disabled>
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="7" r="5"/></svg>
                  <span id="btn-rec-label">START RECORDING</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- TOUCH STATUS -->
        <div>
          <div class="section-label accordion-header" id="touch-header">
            <span>TOUCH SENSOR</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4l4 4 4-4"/></svg>
          </div>
          <div class="accordion-body" id="touch-body">
            <div class="card">
              <div class="touch-display">
                <span class="touch-label">GPIO STATE</span>
                <span class="touch-value" id="touch-val">—</span>
              </div>
              <div class="touch-bar">
                <div class="touch-fill" id="touch-fill"></div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:6px">
                <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">POLL: 500ms</span>
                <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)" id="touch-last">—</span>
              </div>
            </div>
          </div>
        </div>

        <!-- DETECT / DESCRIPTION -->
        <div id="desc-section">
          <div class="desc-header accordion-header" id="desc-header">
            <span class="section-label" style="margin:0">AI DETECTION</span>
            <div class="tts-controls">
              <button class="toggle-auto" id="toggle-auto-tts" title="Auto TTS">AUTO TTS</button>
              <button class="icon-btn" id="btn-tts" title="Speak result">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M3 5H1v4h2l4 3V2L3 5z"/>
                  <path d="M10.5 4.5a3 3 0 0 1 0 5M12.5 2.5a6 6 0 0 1 0 9"/>
                </svg>
              </button>
              <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4l4 4 4-4"/></svg>
            </div>
          </div>
          <div class="accordion-body" id="desc-body">
            <div class="desc-box">
              <span id="desc-text" class="empty">Awaiting detection trigger...</span>
              <span class="desc-cursor" id="cursor" style="display:none"></span>
            </div>
          </div>
        </div>

      </div>

      <!-- API STATUS BAR -->
      <div id="api-status">
        <span class="dot" id="api-dot"></span>
        <span id="api-msg">System ready</span>
      </div>
    </aside>

  </div>
</div>

<script>
const ESP_HOST   = 'http://192.168.1.XXX';
const STREAM_URL = `${ESP_HOST}:9087`;
const HTTP_HOST  = `${ESP_HOST}:80`;
const DETECT_URL = 'http://192.168.1.XXX:80/api/detect';

// ─── STATE ───────────────────────────────────────
let streaming   = false;
let recording   = false;
let autoTTS     = false;
let lastTouch   = -1;
let detecting   = false;
let lastDetect  = 0;
let touchPoller = null;
let recChunks   = [];
let mediaRec    = null;
let streamTime  = 0;
let clockInv    = null;
let recStream   = null;
let recInterval = null;

// ─── ELEMENTS ────────────────────────────────────
const streamImg      = document.getElementById('stream-img');
const placeholder    = document.getElementById('stream-placeholder');
const streamHud      = document.getElementById('stream-hud');
const hudLive        = document.getElementById('hud-live');
const hudRec         = document.getElementById('hud-rec');
const hudTime        = document.getElementById('hud-time');
const btnStream      = document.getElementById('btn-stream');
const btnStreamLabel = document.getElementById('btn-stream-label');
const btnRec         = document.getElementById('btn-rec');
const btnRecLabel    = document.getElementById('btn-rec-label');
const touchVal       = document.getElementById('touch-val');
const touchFill      = document.getElementById('touch-fill');
const touchLast      = document.getElementById('touch-last');
const descText       = document.getElementById('desc-text');
const cursor         = document.getElementById('cursor');
const toggleAutoTTS  = document.getElementById('toggle-auto-tts');
const btnTTS         = document.getElementById('btn-tts');
const streamDot      = document.getElementById('stream-dot');
const streamStatusLbl= document.getElementById('stream-status-label');
const apiDot         = document.getElementById('api-dot');
const apiMsg         = document.getElementById('api-msg');
const wifiLabel      = document.getElementById('wifi-label');
wifiLabel.textContent = ESP_HOST.replace('http://','');

// ─── CLOCK ───────────────────────────────────────
function fmtTime(s){
  const h = String(Math.floor(s/3600)).padStart(2,'0');
  const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const ss= String(s%60).padStart(2,'0');
  return `${h}:${m}:${ss}`;
}

// ─── STATUS HELPERS ──────────────────────────────
function setApiStatus(msg, color='dim'){
  apiMsg.textContent = msg;
  apiDot.className = 'dot ' + ({ok:'green',warn:'amber',err:'red',dim:''}[color]||'');
}

function setStreamStatus(active){
  streamDot.className   = 'dot ' + (active ? 'green pulse' : '');
  streamStatusLbl.textContent = active ? 'LIVE' : 'IDLE';
}

// ─── STREAMING ───────────────────────────────────
btnStream.addEventListener('click', toggleStream);

function toggleStream(){
  if(!streaming){
    startStream();
  } else {
    stopStream();
  }
}

function startStream(){
  streaming = true;
  streamImg.crossOrigin = 'anonymous';
  streamImg.src = `${STREAM_URL}`;
  streamImg.style.display = 'block';
  placeholder.style.display = 'none';
  streamHud.classList.add('visible');
  hudLive.style.display = 'flex';
  btnStream.classList.add('active-stop');
  btnStreamLabel.textContent = 'STOP STREAMING';
  btnRec.disabled = false;
  setStreamStatus(true);
  streamTime = 0;
  clearInterval(clockInv);
  clockInv = setInterval(()=>{ hudTime.textContent = fmtTime(++streamTime); }, 1000);
  startTouchPoll();
  setApiStatus('Stream active — polling touch sensor', 'ok');
}

function stopStream(){
  if(recording) stopRecording();
  streaming = false;
  streamImg.src = '';
  streamImg.style.display = 'none';
  placeholder.style.display = 'flex';
  streamHud.classList.remove('visible');
  hudLive.style.display = 'none';
  btnStream.classList.remove('active-stop');
  btnStreamLabel.textContent = 'START STREAMING';
  btnRec.disabled = true;
  setStreamStatus(false);
  clearInterval(clockInv);
  hudTime.textContent = '--:--:--';
  stopTouchPoll();
  setApiStatus('Stream stopped', 'dim');
}

// ─── RECORDING ───────────────────────────────────
btnRec.addEventListener('click', ()=>{
  if(!recording) startRecording(); else stopRecording();
});

function startRecording(){
  if(!streaming) return;
  try {
    recStream = streamImg.captureStream ? streamImg.captureStream(15) : captureImgStream();
    if(!recStream){
      // fallback: record the img element via canvas
      recStream = captureImgStream();
    }
    recChunks = [];
    mediaRec = new MediaRecorder(recStream, {mimeType:'video/webm;codecs=vp8'});
    mediaRec.ondataavailable = e => { if(e.data.size>0) recChunks.push(e.data); };
    mediaRec.onstop = downloadRecording;
    mediaRec.start(100);
    recording = true;
    btnRec.classList.add('rec-active');
    btnRecLabel.textContent = 'STOP RECORDING';
    hudRec.style.display = 'flex';
    setApiStatus('Recording in progress...', 'warn');
  } catch(e){
    setApiStatus('Recording unavailable: ' + e.message, 'err');
  }
}

function captureImgStream(){
  const c = document.createElement('canvas');
  c.width = streamImg.naturalWidth || 640;
  c.height = streamImg.naturalHeight || 480;
  const ctx = c.getContext('2d');
  recInterval = setInterval(() => { if(recording) ctx.drawImage(streamImg,0,0,c.width,c.height); }, 1000/15);
  return c.captureStream(15);
}

function stopRecording(){
  if(!mediaRec) return;
  recording = false;
  mediaRec.stop();
  clearInterval(recInterval);
  recInterval = null;
  btnRec.classList.remove('rec-active');
  btnRecLabel.textContent = 'START RECORDING';
  hudRec.style.display = 'none';
  setApiStatus('Recording saved', 'ok');
}

function downloadRecording(){
  const blob = new Blob(recChunks, {type:'video/webm'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `visionx-${Date.now()}.webm`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─── TOUCH POLLING ───────────────────────────────
function startTouchPoll(){
  stopTouchPoll();
  touchPoller = setInterval(pollTouch, 500);
}
function stopTouchPoll(){
  clearInterval(touchPoller);
  touchVal.textContent = '—';
  touchVal.className   = 'touch-value';
  touchFill.className  = 'touch-fill';
}

async function pollTouch(){
  try {
    const r = await fetch(`${HTTP_HOST}/touch`, {signal: AbortSignal.timeout(400)});
    const t = await r.text();
    const val = parseInt(t.trim());
    const now = new Date().toLocaleTimeString();
    touchLast.textContent = now;

    if(val === 1){
      touchVal.textContent = 'HIGH';
      touchVal.classList.add('active');
      touchFill.classList.add('active');
      if(lastTouch !== 1) triggerDetect();
    } else {
      touchVal.textContent = 'LOW';
      touchVal.classList.remove('active');
      touchFill.classList.remove('active');
    }
    lastTouch = val;
  } catch(e){
    touchVal.textContent = 'ERR';
  }
}

// ─── DETECTION ───────────────────────────────────
async function triggerDetect(){
  const now = Date.now();
  if(detecting || (now - lastDetect) < 500) return;
  if(!streaming) return;
  detecting = true;
  lastDetect = now;
  setApiStatus('Capturing frame & sending to AI...', 'warn');

  try {
    const frameBlob = await captureFrame();
    if(!frameBlob) throw new Error('No frame');

    const form = new FormData();
    form.append('image', frameBlob, 'frame.jpg');

    const controller = new AbortController();
    const timeout = setTimeout(()=> controller.abort(), 500000);

    const r = await fetch(DETECT_URL, {
      method:'POST',
      body: form,
      signal: controller.signal
    });
    clearTimeout(timeout);

    if(!r.ok) throw new Error(`API ${r.status}`);
    const data = await r.json();
    console.log(data);
    const desc  = data.result.description || 'No description';
    const short = data.result["short-description"];

    showDescription(desc);
    if(autoTTS) speakText(desc);
    sendDisplayMsg(short);
    setApiStatus('Detection complete', 'ok');
  } catch(e){
    setApiStatus('Detection error: ' + e.message, 'err');
  } finally {
    // enforce 500ms cooldown
    await new Promise(r=> setTimeout(r, 500));
    detecting = false;
  }
}

function captureFrame(){
  return new Promise(resolve=>{
    const c = document.createElement('canvas');
    if(!streamImg.naturalWidth){ resolve(null); return; }
    c.width  = streamImg.naturalWidth  || 640;
    c.height = streamImg.naturalHeight || 480;
    c.getContext('2d').drawImage(streamImg, 0,0, c.width, c.height);
    c.toBlob(b=> resolve(b), 'image/jpeg', 0.85);
  });
}

async function sendDisplayMsg(msg){
  try {
    await fetch(`${HTTP_HOST}/display?msg=${encodeURIComponent(msg)}`);
  } catch(e){}
}

// ─── DESCRIPTION & TTS ───────────────────────────
let lastDesc = '';
function showDescription(text){
  lastDesc = text;
  descText.className = '';
  descText.textContent = text;
  cursor.style.display = 'inline-block';
  setTimeout(()=> cursor.style.display='none', 3000);
  descText.parentElement.scrollTop = descText.parentElement.scrollHeight;
}

function speakText(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
  btnTTS.classList.add('on');
  u.onend = ()=> btnTTS.classList.remove('on');
}

btnTTS.addEventListener('click', ()=>{
  if(lastDesc) speakText(lastDesc);
});

toggleAutoTTS.addEventListener('click', ()=>{
  autoTTS = !autoTTS;
  toggleAutoTTS.classList.toggle('on', autoTTS);
  toggleAutoTTS.textContent = autoTTS ? 'AUTO: ON' : 'AUTO TTS';
});

// ─── ACCORDION (mobile) ──────────────────────────
['ctrl','touch','desc'].forEach(id=>{
  const h = document.getElementById(id+'-header');
  const b = document.getElementById(id+'-body');
  if(!h||!b) return;
  h.addEventListener('click', e=>{
    // don't collapse if clicking TTS buttons inside
    if(e.target.closest('.tts-controls') && id==='desc') return;
    const isMobile = window.innerWidth <= 768;
    if(!isMobile) return;
    h.classList.toggle('collapsed');
    b.classList.toggle('collapsed');
  });
});

// ─── HAMBURGER (visual only — panels always visible) ──
document.getElementById('hamburger').addEventListener('click', function(){
  this.classList.toggle('open');
});

// ─── INIT ────────────────────────────────────────
setApiStatus('System ready', 'dim');
</script>
</body>
</html>
